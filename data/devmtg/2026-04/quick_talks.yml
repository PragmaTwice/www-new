quick_talks:
  - title: "Challenges in binary rewriting: enabling BOLT to optimize CFI-hardened binaries"
    speaker: "Gergely Balint"
    video_url: ""
    slides_url: "/devmtg/2026-04/slides/quick_talk/quick_talk_balint.pdf"
    description: |
      BOLT is increasingly adopted as it can provide additional performance uplift on top of LTO+PGO
      optimized binaries. At the same time, AArch64 binaries are commonly deployed with Control Flow
      Integrity features (PAC and BTI) enabled. This creates a practical challenge: until recently, BOLT
      couldn’t optimize such binaries. It would either crash, or worse: emit incorrect binaries,
      crashing at runtime. The talk introduces our work on enabling these features, and describes key
      engineering challenges, including how implementing such features differs from their compiler
      counterparts.

  - title: "Anatomy of Tiling and Vectorizing linalg.pack and linalg.unpack"
    speaker: "Ege Beysel"
    video_url: ""
    slides_url: "/devmtg/2026-04/slides/quick_talk/quick_talk_beysel.pdf"
    description: |
      linalg.pack and linalg.unpack enable explicit data-tiling and layout transformations in MLIR, but
      their use in data-tiled compilation flows raises subtle questions about alignment, legality, and
      vectorization. This talk explores how these operations interact with MLIR’s tiling and
      vectorization infrastructure, focusing on alignment constraints, masking semantics, and
      performance implications. Using an end-to-end data-tiled matmul example, the talk highlights
      practical guidance and performance gains for developers building high-performance tensor
      pipelines.

  - title: "Leveraging BOLT to improve data prefetching for AArch64 binaries"
    speaker: "Shanzhi Chen, Wei Wei"
    video_url: ""
    slides_url: "/devmtg/2026-04/slides/quick_talk/quick_talk_chen_wei.pdf"
    description: |
      The post-link optimizer BOLT has provided a bunch of binary-level optimizations which mostly focus
      on code layout and effectively reduce front-end stalls in the Top-Down performance analysis view.
      In addition, we found that BOLT could also be a handy tool to emit prefetching instructions in
      binaries and to alleviate back-end stalls resulting from cache misses. In this talk, we will cover
      how to leverage BOLT to improve data prefetching for AArch64 binaries. A new pass is added to BOLT
      to provide prefetching support for different variations of AArch64 load instructions. And the
      existing dataflow analysis framework in BOLT is also enabled for AArch64 to provide register
      liveness information for prefetching addresses. In addition, the ARM SPE-based profiling technique
      is employed to provide valuable insights into memory operations and to complete the overall
      profile-guided data prefetching optimization in BOLT.

  - title: "Mojo Compile-time Interpreter in MLIR"
    speaker: "Weiwei Chen"
    video_url: ""
    slides_url: "/devmtg/2026-04/slides/quick_talk/quick_talk_chen.pdf"
    description: |
      Mojo supports powerful compile time meta-programming that helps to unlock performance on
      heterogeneous accelerators by enabling generic abstractions across different targets. Almost any
      runtime Mojo code can be moved to compile-time to trade for runtime performance while constants
      evaluated at compile-time can be materialized into runtime values. In this talk, we will dive into
      the architecture of Mojo’s MLIR based compile-time interpreter which is at the core of
      materializing generic code into concrete form during compilation. We'll share implementation
      insights, performance challenges, and lessons learned, while fostering discussion on building
      meta-programming compilers with MLIR.

  - title: "Self-Contained, Target-Specific GEMM Code Generation in MLIR"
    speaker: "Adam Siemieniuk, Renato Golin, Rolf Morel"
    video_url: ""
    slides_url: "/devmtg/2026-04/slides/quick_talk/quick_talk_golin_morel_siemieniuk.pdf"
    description: |
      We present an MLIR-based approach for generating target-specific, highly optimized GEMM kernels
      that is fully self-contained within the LLVM/MLIR compiler infrastructure and does not rely on
      external libraries such as LIBXSMM, Intel MKL, or oneDNN. Building on prior work in the TPP-MLIR
      compiler, we upstream FP32, BF16, and INT8 code-generation techniques into MLIR and propose a
      transform schedule that combines existing and newly upstreamed passes to lower matmul, batch
      matmul, and batch-reduce matmul operations into optimized kernels, achieving performance
      competitive with the LIBXSMM library. As a future work, we plan to leverage auto-tuning techniques
      to select efficient tile sizes based on hardware characteristics and problem dimensions.

  - title: "LLVM JIT — Upcoming Challenges and Opportunities"
    speaker: "Lang Hames"
    video_url: ""
    slides_url: "/devmtg/2026-04/slides/quick_talk/quick_talk_hames.pdf"
    description: |
      LLVM's JIT can now run arbitrary real-world applications, as demonstrated by Xcode's Previews
      feature. Despite this success, enormous opportunities for improvement remain—especially in
      performance, memory consumption, tooling, and optimization. This talk will describe the most
      promising opportunities in these areas, sketch a roadmap for tackling them, and discuss how the
      community can collaborate to accelerate progress.

  - title: "Apple GPU Support in Mojo"
    speaker: "Kolya Panchenko"
    video_url: ""
    slides_url: "/devmtg/2026-04/slides/quick_talk/quick_talk_panchenko.pdf"
    description: |
      Mojo's powerful compile-time meta-programming system and unified syntax make it exceptionally
      well-suited for heterogeneous accelerator programming, with proven success on CUDA and ROCm
      platforms. As many developers work on Apple products (such as iMacs, MacBooks, Mac Studios etc)
      adding Apple GPU support to Mojo is a natural next step. However, unlike CUDA and ROCm, which have
      open-source compiler toolchains in upstream LLVM, Apple's GPU compiler stack is proprietary. We
      will present chosen design and discuss challenges of Apple GPU’s integration into Mojo.

  - title: "Attack of the Clones: Speeding Up Coroutine Compilation"
    speaker: "Artem Pianykh"
    video_url: ""
    slides_url: "/devmtg/2026-04/slides/quick_talk/quick_talk_pianykh.pdf"
    description: |
      Compiling coroutines with full debug information shouldn't be dramatically slower than with line
      tables — but we found CoroSplitPass running over 100x slower, adding minutes to compilation time.
      The cause traced back to LLVM's function cloning, where processing debug info metadata was
      O(Module) rather than O(Function). This talk covers the investigation, the upstream patches, and
      how the fix ended up benefiting all users of the function cloning API.

  - title: "Tracking Operations Through MLIR Pass Pipelines Using Source Locations"
    speaker: "Florian Walbroel"
    video_url: ""
    slides_url: "/devmtg/2026-04/slides/quick_talk/quick_talk_walbroel.pdf"
    description: |
      This talk presents a source-location-driven approach for tracking the evolution of MLIR operations
      across deep pass pipelines. Motivated by real-world optimization work on quantized convolutions in
      IREE, it shows how preserved source locations can be used to reconstruct operation lineage across
      IR stages, enabling systematic reasoning about transformation effects. The talk surveys source
      location semantics under common MLIR transformations and demonstrates a reusable Python-based tool
      that supports interactive, cross-stage operation tracking for improved debuggability in large MLIR
      programs.
